name: wash_wallet_workspace
publish_to: none

environment:
  sdk: ^3.9.2

workspace:
  - apps/cashier
  - apps/production
  - apps/customer
  - packages/wash_wallet_core
  - packages/wash_wallet_domain
  - packages/wash_wallet_data
  - packages/wash_wallet_ui

dev_dependencies:
  melos: ^7.5.1

melos:
  name: wash_wallet
  packages:
    - apps/**
    - packages/**
  command:
    bootstrap:
      usePubspecOverrides: true
  scripts:
    analyze:
      run: melos exec -- "flutter analyze --no-fatal-infos"
      description: Run flutter analyze in all packages
    build_runner:
      run: melos exec --depends-on="build_runner" -- "dart run build_runner build --delete-conflicting-outputs"
      description: Run build_runner in all packages
    clean:
      run: melos exec -- "flutter clean"
      description: Clean all packages
    get:
      run: melos exec -- "flutter pub get"
      description: Get dependencies for all packages
    test:
      run: melos exec -- "flutter test"
      description: Run tests in all packages
