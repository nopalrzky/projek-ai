<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphify Callflow - Console Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;750&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0b; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card { background: linear-gradient(145deg, #18181b 0%, #09090b 100%); }
    .card:hover { background: linear-gradient(145deg, #1f1f23 0%, #18181b 100%); }
  </style>
</head>
<body class="text-zinc-100 min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-56 bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full transition-transform duration-300">
    <div class="p-4 pt-20">
      <nav class="space-y-2">
        <a href="/" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900 transition">
          <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
          <span class="text-sm font-medium">Dashboard</span>
        </a>
        <a href="cek-github.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900 transition">
          <i data-lucide="shield-check" class="h-5 w-5"></i>
          <span class="text-sm font-medium">Cek GitHub</span>
        </a>
        <a href="graphify.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-emerald-600/20 border border-emerald-500/30">
          <i data-lucide="git-branch" class="h-5 w-5 text-emerald-400"></i>
          <span class="text-sm font-medium text-emerald-300">Graphify</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- Sidebar toggle button -->
  <button onclick="toggleSidebar()" class="fixed left-4 top-4 z-[100] p-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:bg-zinc-800 transition shadow-lg">
    <i data-lucide="menu" class="h-5 w-5 text-zinc-400"></i>
  </button>

  <!-- Sidebar overlay -->
  <button onclick="toggleSidebar()" id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden"></button>

  <!-- ═══ CONTENT ═══ -->
  <div class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-zinc-800/50 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-20">
      <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-3 ml-12">
          <h1 class="text-lg font-semibold tracking-tight">Console Monitor</h1>
          <span class="text-xs text-zinc-600 font-mono bg-zinc-900 px-2 py-0.5 rounded">Graphify</span>
        </div>
      </div>
    </header>

    <!-- Iframe: callflow HTML -->
    <div class="flex-1 p-0">
      <iframe src="graphify-callflow.html" class="w-full h-[calc(100vh-49px)] border-0" title="Graphify Callflow"></iframe>
    </div>

  </div>

  <script>
    // Sidebar toggle
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }

    // Lucide icons
    if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>
</body>
</html>
