<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;750&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0b; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(12px); }
    .card { background: linear-gradient(145deg, #18181b 0%, #09090b 100%); }
    .card:hover { background: linear-gradient(145deg, #1f1f23 0%, #18181b 100%); }
    .online-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
  </style>
</head>
<body class="text-zinc-100 min-h-screen">
  
  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-56 bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full transition-transform duration-300">
    <div class="p-4 pt-20">
      <nav class="space-y-2">
        <button onclick="showPage('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition bg-indigo-600/20 border border-indigo-500/30">
          <i data-lucide="layout-dashboard" class="h-5 w-5 text-indigo-400"></i>
          <span class="text-sm font-medium text-indigo-300">Dashboard</span>
        </button>
        <button onclick="showPage('cek-github')" id="nav-cek-github" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900 transition">
          <i data-lucide="shield-check" class="h-5 w-5"></i>
          <span class="text-sm font-medium">Cek GitHub</span>
        </button>
      </nav>
    </div>
  </aside>

  <!-- SIDEBAR TOGGLE -->
  <button onclick="toggleSidebar()" class="fixed left-4 top-4 z-[100] p-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:bg-zinc-800 transition shadow-lg">
    <i data-lucide="menu" class="h-5 w-5 text-zinc-400"></i>
  </button>
  <button onclick="toggleSidebar()" id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden"></button>

  <!-- HEADER -->
  <header class="border-b border-zinc-800/60 glass sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
          <i data-lucide="server" class="text-white h-5 w-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">Console Monitor</h1>
          <p class="text-[10px] text-zinc-500 uppercase tracking-wider">Process Manager</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <!-- 9Router Quick Access -->
        <div id="header-9router" class="hidden flex items-center gap-2 bg-gradient-to-r from-indigo-600/20 to-purple-600/20 border border-indigo-500/30 rounded-lg px-3 py-1.5">
          <i data-lucide="router" class="h-4 w-4 text-indigo-400"></i>
          <span class="text-xs font-medium text-indigo-300">9Router</span>
          <span id="header-9router-status" class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <div class="flex items-center gap-1 ml-1" id="header-9router-controls">
            <button id="header-9router-start" onclick="action('9Router Dashboard','start','header-9router-start')" class="hidden text-emerald-400 hover:text-emerald-300 transition" title="Start 9Router">
              <i data-lucide="play" class="h-3.5 w-3.5"></i>
            </button>
          </div>
          <button id="header-9router-logs" onclick="toggleLogs('9Router Dashboard')" class="text-zinc-400 hover:text-emerald-400 transition" title="View Logs">
            <i data-lucide="terminal" class="h-3.5 w-3.5"></i>
          </button>
          <a href="http://localhost:20128/" target="_blank" class="text-zinc-400 hover:text-indigo-400 transition" title="Open Gateway">
            <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
          </a>
        </div>
        <input type="text" id="search-input" placeholder="Cari service..." class="bg-zinc-900/80 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-300 placeholder-zinc-600 focus:outline-none focus:border-indigo-500 w-64"/>
        <div class="flex items-center gap-2 bg-zinc-900/80 border border-zinc-800 rounded-full px-4 py-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-zinc-300 font-medium text-sm" id="system-status">Loading...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- SUMMARY CARDS -->
  <section class="border-b border-zinc-800/40 bg-zinc-950/30">
    <div class="max-w-7xl mx-auto px-6 py-6">
      <div class="grid grid-cols-4 gap-4" id="summary-cards"></div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main id="main-content" class="max-w-7xl mx-auto px-6 py-8 transition-all duration-300">
    <div id="services-container" class="space-y-10"></div>
  </main>

  <!-- CEK GITHUB PAGE -->
  <main id="page-cek-github" class="hidden fixed inset-0 z-[60] bg-zinc-950 overflow-auto max-w-4xl mx-auto px-6 py-8 transition-all duration-300">
    <div class="text-center mb-8">
      <div class="h-16 w-16 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="shield-check" class="text-white h-8 w-8"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Cek Keamanan GitHub</h2>
      <p class="text-zinc-400">Masukkan URL repository GitHub untuk dicek keamanannya</p>
    </div>

    <!-- Security Layer Status Indicators -->
    <div id="layer-status" class="grid grid-cols-5 gap-3 mb-6">
      <div class="card rounded-lg p-3 border border-zinc-800 text-center" id="status-gitleaks">
        <div class="h-8 w-8 mx-auto bg-zinc-800 rounded-full flex items-center justify-center mb-2">
          <i data-lucide="key" class="h-4 w-4 text-zinc-500"></i>
        </div>
        <p class="text-xs text-zinc-500">Gitleaks</p>
        <p class="text-xs text-zinc-600 mt-1">○ Pending</p>
      </div>
      <div class="card rounded-lg p-3 border border-zinc-800 text-center" id="status-trivy">
        <div class="h-8 w-8 mx-auto bg-zinc-800 rounded-full flex items-center justify-center mb-2">
          <i data-lucide="shield-alert" class="h-4 w-4 text-zinc-500"></i>
        </div>
        <p class="text-xs text-zinc-500">Trivy</p>
        <p class="text-xs text-zinc-600 mt-1">○ Pending</p>
      </div>
      <div class="card rounded-lg p-3 border border-zinc-800 text-center" id="status-scorecard">
        <div class="h-8 w-8 mx-auto bg-zinc-800 rounded-full flex items-center justify-center mb-2">
          <i data-lucide="clipboard-check" class="h-4 w-4 text-zinc-500"></i>
        </div>
        <p class="text-xs text-zinc-500">Scorecard</p>
        <p class="text-xs text-zinc-600 mt-1">○ Pending</p>
      </div>
      <div class="card rounded-lg p-3 border border-zinc-800 text-center" id="status-codeql">
        <div class="h-8 w-8 mx-auto bg-zinc-800 rounded-full flex items-center justify-center mb-2">
          <i data-lucide="code" class="h-4 w-4 text-zinc-500"></i>
        </div>
        <p class="text-xs text-zinc-500">CodeQL</p>
        <p class="text-xs text-zinc-600 mt-1">○ Pending</p>
      </div>
      <div class="card rounded-lg p-3 border border-zinc-800 text-center" id="status-zizmor">
        <div class="h-8 w-8 mx-auto bg-zinc-800 rounded-full flex items-center justify-center mb-2">
          <i data-lucide="workflow" class="h-4 w-4 text-zinc-500"></i>
        </div>
        <p class="text-xs text-zinc-500">zizmor</p>
        <p class="text-xs text-zinc-600 mt-1">○ Pending</p>
      </div>
    </div>

    <!-- Input Section -->
    <div class="card rounded-xl p-6 border border-zinc-800 mb-6">
      <div class="flex gap-3">
        <input type="text" id="github-url" placeholder="https://github.com/owner/repo" 
          class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500">
        <button id="run-check-btn" onclick="console.log('button clicked'); runSecurityCheck()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-lg font-medium transition flex items-center gap-2">
          <i data-lucide="play" class="h-5 w-5"></i>
          <span>Jalankan</span>
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="security-loading" class="hidden card rounded-xl p-8 border border-zinc-800 text-center">
      <i data-lucide="loader-2" class="animate-spin h-10 w-10 text-emerald-500 mx-auto mb-4"></i>
      <p class="text-zinc-300 font-medium mb-2">Sedang Mengecek...</p>
      <p class="text-zinc-500 text-sm" id="security-loading-status">Mempersiapkan</p>
    </div>

    <!-- Results -->
    <div id="security-results" class="hidden space-y-4"></div>

    <!-- Action Buttons -->
    <div id="security-actions" class="hidden flex justify-center gap-4 mt-8">
      <button onclick="importToFolder()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-lg font-medium transition flex items-center gap-2">
        <i data-lucide="folder-plus" class="h-5 w-5"></i>
        <span>Import ke Folder</span>
      </button>
      <button onclick="abortCheck()" class="bg-zinc-700 hover:bg-zinc-600 text-white px-6 py-3 rounded-lg font-medium transition flex items-center gap-2">
        <i data-lucide="x" class="h-5 w-5"></i>
        <span>Batal</span>
      </button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-zinc-900 bg-zinc-950/80 py-4 px-6 text-xs text-zinc-600 flex justify-between items-center max-w-7xl mx-auto">
    <span>© 2026 Console Monitor</span>
    <span class="flex items-center gap-1 mono">
      <i data-lucide="clock" class="h-3.5 w-3.5"></i> Last: <span id="last-checked">-</span>
    </span>
  </footer>

  <script>
    let allData = {};
    let openLogs = {};
    const logRefreshIntervals = {};

    function formatTime(date) { return date.toTimeString().split(' ')[0]; }

    function renderSummary(data) {
      const online = Object.values(data).filter(s => s.online).length;
      const offline = Object.values(data).filter(s => !s.online).length;
      const total = Object.keys(data).length;
      const latencies = Object.values(data).filter(s => s.online && s.latency).map(s => s.latency);
      const avgLatency = latencies.length ? Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length) : 0;

      const cards = [
        { label: 'Running', value: online, icon: 'play', color: 'emerald', bg: 'bg-emerald-500/10', border: 'border-emerald-500/20' },
        { label: 'Offline', value: offline, icon: 'power-off', color: 'rose', bg: 'bg-rose-500/10', border: 'border-rose-500/20' },
        { label: 'Total Services', value: total, icon: 'server', color: 'indigo', bg: 'bg-indigo-500/10', border: 'border-indigo-500/20' },
        { label: 'Avg Latency', value: avgLatency ? avgLatency + 'ms' : '-', icon: 'activity', color: 'amber', bg: 'bg-amber-500/10', border: 'border-amber-500/20' }
      ];

      document.getElementById('summary-cards').innerHTML = cards.map(c => `
        <div class="card rounded-xl p-4 border ${c.border}">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs text-zinc-500 uppercase tracking-wider">${c.label}</p>
              <p class="text-2xl font-bold text-${c.color}-400 mt-1">${c.value}</p>
            </div>
            <div class="h-10 w-10 ${c.bg} rounded-lg flex items-center justify-center">
              <i data-lucide="${c.icon}" class="text-${c.color}-400 h-5 w-5"></i>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function action(name, act, btnId) {
      const btn = document.getElementById(btnId);
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="animate-spin h-4 w-4"></i>';
      lucide.createIcons();

      try {
        await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ serviceName: name, action: act }) });
        setTimeout(update, 1500);
      } catch (e) {
        alert('Failed: ' + e.message);
        btn.disabled = false;
        btn.innerHTML = orig;
        lucide.createIcons();
      }
    }

    function render(data, query = '') {
      const c = document.getElementById('services-container');
      
      const filtered = {};
      Object.entries(data).forEach(([name, info]) => {
        if (query === '' || name.toLowerCase().includes(query.toLowerCase()) || (info.workspace && info.workspace.toLowerCase().includes(query.toLowerCase()))) {
          filtered[name] = info;
        }
      });

      if (Object.keys(filtered).length === 0) {
        c.innerHTML = '<div class="flex flex-col items-center py-20"><i data-lucide="search-x" class="h-12 w-12 text-zinc-600"></i><p class="text-sm text-zinc-500 mt-3">No services found</p></div>';
        lucide.createIcons();
        return;
      }

      const mainProjects = {};
      const infra = {};

      Object.entries(filtered).forEach(([name, info]) => {
        if (name.includes('9Router')) {
          // 9Router shown in header, skip here
        } else if (info.workspace === 'Infrastructure') {
          infra[name] = info;
        } else {
          if (!mainProjects[info.workspace]) mainProjects[info.workspace] = {};
          mainProjects[info.workspace][name] = info;
        }
      });

      let html = '';

      if (Object.keys(mainProjects).length > 0) {
        html += `<section class="mb-10">
          <div class="flex items-center gap-3 mb-6">
            <div class="h-8 w-8 bg-indigo-500/20 rounded-lg flex items-center justify-center">
              <i data-lucide="briefcase" class="text-indigo-400 h-4 w-4"></i>
            </div>
            <h2 class="text-lg font-semibold text-white">Main Projects</h2>
          </div>`;

        Object.entries(mainProjects).forEach(([workspace, services]) => {
          html += `<div class="mb-8">
            <div class="flex items-center gap-2 mb-4 px-1">
              <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider">${workspace}</span>
              <div class="h-px bg-zinc-800 flex-grow"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;

          Object.entries(services).forEach(([name, info]) => {
            html += renderCard(name, info);
          });

          html += `</div></div>`;
        });
        html += '</section>';
      }

      if (Object.keys(infra).length > 0) {
        html += `<section>
          <div class="flex items-center gap-3 mb-6">
            <div class="h-8 w-8 bg-purple-500/20 rounded-lg flex items-center justify-center">
              <i data-lucide="hard-drive" class="text-purple-400 h-4 w-4"></i>
            </div>
            <h2 class="text-lg font-semibold text-white">Infrastructure & Developer Tools</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;

        Object.entries(infra).forEach(([name, info]) => {
          html += renderCard(name, info);
        });

        html += '</div></section>';
      }

      c.innerHTML = html;
      lucide.createIcons();
    }

    function renderCard(name, info) {
      const isOnline = info.online;
      const is9Router = name.includes('9Router');
      
      const sid = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      
      const badge = isOnline 
        ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>ACTIVE</span>'
        : '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-zinc-800 text-zinc-400 border border-zinc-700"><span class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span>OFFLINE</span>';
      
      const typeLabel = is9Router ? 'AI Gateway' : (info.type || 'Service');
      const roleLabel = is9Router ? 'Model Router / LLM Gateway' : '';
      
      let cardClass = 'card rounded-xl p-5 border border-zinc-800/60 transition-all duration-200';
      if (isOnline) cardClass += ' online-glow';
      
      const logOpen = isOnline && openLogs[name];
      
      let btns = '';
      if (info.protected) {
        btns = isOnline 
          ? `<a href="http://localhost:${info.port}/" target="_blank" class="flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-2.5 px-4 rounded-xl transition flex-grow text-sm">
              <span>Open Gateway</span> <i data-lucide="external-link" class="h-4 w-4"></i>
            </a>`
          : `<div class="text-center bg-zinc-800/50 text-zinc-500 font-medium py-2.5 px-4 rounded-xl flex-grow text-sm">Protected</div>`;
      } else {
        const powerBtn = isOnline
          ? `<button id="stop-${sid}" onclick="action('${name}','stop','stop-${sid}')" class="flex items-center justify-center bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white border border-rose-500/20 hover:border-transparent font-semibold py-2.5 px-4 rounded-xl transition">
              <i data-lucide="power" class="h-4 w-4"></i>
            </button>`
          : `<button id="start-${sid}" onclick="action('${name}','start','start-${sid}')" class="flex items-center justify-center bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 px-4 rounded-xl transition">
              <i data-lucide="play" class="h-4 w-4"></i>
            </button>`;
        
        const openBtn = isOnline ? `<a href="http://localhost:${info.port}/" target="_blank" class="flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-4 rounded-xl transition"><i data-lucide="external-link" class="h-4 w-4"></i></a>` : '';
        const restartBtn = isOnline ? `<button id="restart-${sid}" onclick="action('${name}','restart','restart-${sid}')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-2.5 px-4 rounded-xl transition"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>` : '';
        const logBtn = isOnline ? `<button onclick="toggleLogs('${name}')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-2.5 px-4 rounded-xl transition"><i data-lucide="terminal" class="h-4 w-4"></i></button>` : '';
        
        btns = powerBtn + openBtn + restartBtn + logBtn;
      }

      let infoRows = `
        <div class="flex justify-between py-1.5 border-b border-zinc-800/50">
          <span class="text-xs text-zinc-500">Port</span>
          <span class="text-xs font-mono text-indigo-400 font-semibold">${info.port}</span>
        </div>
        <div class="flex justify-between py-1.5 border-b border-zinc-800/50">
          <span class="text-xs text-zinc-500">Latency</span>
          <span class="text-xs font-mono text-zinc-300 font-semibold">${isOnline ? info.latency + 'ms' : '-'}</span>
        </div>`;
      
      if (info.pid) {
        infoRows += `<div class="flex justify-between py-1.5">
          <span class="text-xs text-zinc-500">PID</span>
          <span class="text-xs font-mono text-amber-400 font-semibold">${info.pid}</span>
        </div>`;
      }

      if (is9Router && roleLabel) {
        infoRows += `<div class="flex justify-between py-1.5">
          <span class="text-xs text-zinc-500">Role</span>
          <span class="text-xs font-mono text-purple-400 font-semibold">${roleLabel}</span>
        </div>`;
      }

      return `<div class="${cardClass}">
        <div class="flex justify-between items-start mb-4">
          <div>
            <span class="text-[10px] text-zinc-500 uppercase tracking-wider font-semibold">${typeLabel}</span>
            <h3 class="text-base font-bold text-white mt-0.5">${name}</h3>
          </div>
          ${badge}
        </div>
        <div class="bg-zinc-900/50 rounded-lg p-3 mb-4 border border-zinc-800/50">
          ${infoRows}
        </div>
        <div class="flex gap-2">${btns}</div>
        <div id="logs-${sid}" class="${logOpen ? '' : 'hidden'} mt-4 bg-black/50 border border-zinc-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="terminal" class="h-4 w-4 text-emerald-400"></i>
              <span class="text-sm font-semibold text-zinc-400">CONSOLE OUTPUT</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="copyLogs('${name}')" class="flex items-center gap-1.5 text-xs text-indigo-400 hover:text-indigo-300 transition">
                <i data-lucide="copy" class="h-3.5 w-3.5"></i><span>Copy</span>
              </button>
              <button onclick="clearLogs('${name}')" class="flex items-center gap-1.5 text-xs text-rose-400 hover:text-rose-300 transition">
                <i data-lucide="trash-2" class="h-3.5 w-3.5"></i><span>Clear</span>
              </button>
            </div>
          </div>
          <div id="logs-content-${sid}" class="font-mono text-xs leading-relaxed max-h-64 overflow-y-auto">No logs yet...</div>
        </div>
      </div>`;
    }

    function toggleLogs(serviceName) {
      const sid = serviceName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      const logsDiv = document.getElementById('logs-' + sid);
      
      if (!logsDiv) return;
      
      if (logsDiv.classList.contains('hidden')) {
        openLogs[serviceName] = true;
        logsDiv.classList.remove('hidden');
        startLogRefresh(serviceName);
      } else {
        openLogs[serviceName] = false;
        logsDiv.classList.add('hidden');
        stopLogRefresh(serviceName);
      }
      lucide.createIcons();
    }

    async function refreshLogs(serviceName) {
      const sid = serviceName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      const contentDiv = document.getElementById('logs-content-' + sid);
      if (!contentDiv) return;
      
      try {
        const res = await fetch('/api/logs/' + encodeURIComponent(serviceName));
        const logs = await res.json();
        if (logs.length === 0) {
          contentDiv.innerHTML = '<span class="text-zinc-600">No logs available yet.</span>';
        } else {
          contentDiv.innerHTML = logs.map(entry => {
            const time = new Date(entry.time).toLocaleTimeString('id-ID');
            const lineClass = entry.line.startsWith('[ERROR]') ? 'text-rose-400' : 'text-emerald-400';
            return '<div class="' + lineClass + '">[' + time + '] ' + entry.line + '</div>';
          }).join('');
          contentDiv.scrollTop = contentDiv.scrollHeight;
        }
      } catch (e) {
        contentDiv.innerHTML = '<span class="text-rose-400">Failed to load logs: ' + e.message + '</span>';
      }
    }

    async function clearLogs(serviceName) {
      const sid = serviceName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      try {
        await fetch('/api/logs/' + encodeURIComponent(serviceName) + '/clear', { method: 'POST' });
        const contentDiv = document.getElementById('logs-content-' + sid);
        if (contentDiv) contentDiv.innerHTML = '<span class="text-zinc-600">Logs cleared.</span>';
      } catch (e) {
        console.error('Failed to clear logs:', e);
      }
    }

    async function copyLogs(serviceName) {
      const sid = serviceName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      const contentDiv = document.getElementById('logs-content-' + sid);
      if (!contentDiv) return;
      
      const text = contentDiv.innerText;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.querySelector(`button[onclick="copyLogs('${serviceName}')"]`);
        if (btn) {
          btn.innerHTML = '<i data-lucide="check" class="h-3.5 w-3.5"></i><span>Copied</span>';
          lucide.createIcons();
          setTimeout(() => {
            btn.innerHTML = '<i data-lucide="copy" class="h-3.5 w-3.5"></i><span>Copy</span>';
            lucide.createIcons();
          }, 2000);
        }
      } catch (e) {
        console.error('Failed to copy:', e);
      }
    }

    function startLogRefresh(serviceName) {
      if (logRefreshIntervals[serviceName]) return;
      refreshLogs(serviceName);
      logRefreshIntervals[serviceName] = setInterval(() => refreshLogs(serviceName), 2000);
    }

    function stopLogRefresh(serviceName) {
      if (logRefreshIntervals[serviceName]) {
        clearInterval(logRefreshIntervals[serviceName]);
        delete logRefreshIntervals[serviceName];
      }
    }

    async function update() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        allData = data;
        
        document.getElementById('last-checked').innerText = formatTime(new Date());
        renderSummary(data);
        
        const q = document.getElementById('search-input').value;
        render(data, q);
        
        // Restore log refresh for open logs after re-render
        Object.keys(openLogs).forEach(name => {
          if (openLogs[name] && data[name]?.online) {
            startLogRefresh(name);
          }
        });
        
        const online = Object.values(data).filter(s => s.online).length;
        const total = Object.keys(data).length;
        document.getElementById('system-status').innerText = online + '/' + total + ' active';
        
        // Update 9Router header status
        const router9Data = data['9Router Dashboard'];
        const header9Router = document.getElementById('header-9router');
        const header9RouterStatus = document.getElementById('header-9router-status');
        const header9RouterStart = document.getElementById('header-9router-start');
        const header9RouterStop = document.getElementById('header-9router-stop');
        const header9RouterRestart = document.getElementById('header-9router-restart');
        
        if (router9Data && header9Router && header9RouterStatus) {
          header9Router.classList.remove('hidden');
          header9Router.classList.add('flex');
          if (router9Data.online) {
            header9RouterStatus.classList.remove('bg-rose-400');
            header9RouterStatus.classList.add('bg-emerald-400');
            header9RouterStart?.classList.add('hidden');
          } else {
            header9RouterStatus.classList.remove('bg-emerald-400');
            header9RouterStatus.classList.add('bg-rose-400');
            header9RouterStart?.classList.remove('hidden');
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      render(allData, e.target.value);
    });

    update();
    setInterval(update, 5000);

    // ============ SIDEBAR & PAGE NAVIGATION ============
    let currentPage = 'dashboard';
    let currentRepoPath = null;

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('-translate-x-full');
      if (overlay) overlay.classList.toggle('hidden');
    }

    function showPage(page) {
      console.log('showPage called with:', page);
      currentPage = page;
      const dashboard = document.getElementById('main-content');
      const cekGithub = document.getElementById('page-cek-github');
      const navDashboard = document.getElementById('nav-dashboard');
      const navCekGithub = document.getElementById('nav-cek-github');

      if (page === 'dashboard') {
        dashboard.classList.remove('hidden');
        cekGithub.classList.add('hidden');
        navDashboard.classList.add('bg-indigo-600/20', 'border-indigo-500/30', 'text-indigo-300');
        navDashboard.classList.remove('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-900');
        navCekGithub.classList.remove('bg-emerald-600/20', 'border-emerald-500/30', 'text-emerald-300');
        navCekGithub.classList.add('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-900');
      } else {
        dashboard.classList.add('hidden');
        cekGithub.classList.remove('hidden');
        navCekGithub.classList.add('bg-emerald-600/20', 'border-emerald-500/30', 'text-emerald-300');
        navCekGithub.classList.remove('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-900');
        navDashboard.classList.remove('bg-indigo-600/20', 'border-indigo-500/30', 'text-indigo-300');
        navDashboard.classList.add('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-900');
      }
      lucide.createIcons();
    }

    // ============ SECURITY CHECK ============
    function updateLoadingStatus(status) {
      document.getElementById('security-loading-status').textContent = status;
    }

    // Update layer status indicator
    function setLayerStatus(layerName, status, message) {
      const el = document.getElementById('status-' + layerName);
      if (!el) return;
      
      const iconEl = el.querySelector('i');
      const msgEl = el.querySelectorAll('p')[1];
      
      if (status === 'loading') {
        el.className = 'card rounded-lg p-3 border border-zinc-800 text-center bg-zinc-800/30';
        iconEl.className = 'h-4 w-4 text-amber-400 animate-pulse';
        msgEl.className = 'text-xs text-amber-400 mt-1';
        msgEl.textContent = '○ Loading...';
      } else if (status === 'success') {
        el.className = 'card rounded-lg p-3 border border-emerald-500/30 text-center bg-emerald-500/5';
        iconEl.className = 'h-4 w-4 text-emerald-400';
        msgEl.className = 'text-xs text-emerald-400 mt-1';
        msgEl.textContent = '✓ Aman';
      } else if (status === 'warning') {
        el.className = 'card rounded-lg p-3 border border-amber-500/30 text-center bg-amber-500/5';
        iconEl.className = 'h-4 w-4 text-amber-400';
        msgEl.className = 'text-xs text-amber-400 mt-1';
        msgEl.textContent = '⚠ ' + (message || 'Warning');
      } else if (status === 'error') {
        el.className = 'card rounded-lg p-3 border border-rose-500/30 text-center bg-rose-500/5';
        iconEl.className = 'h-4 w-4 text-rose-400';
        msgEl.className = 'text-xs text-rose-400 mt-1';
        msgEl.textContent = '✕ Error';
      } else {
        el.className = 'card rounded-lg p-3 border border-zinc-800 text-center';
        iconEl.className = 'h-4 w-4 text-zinc-500';
        msgEl.className = 'text-xs text-zinc-600 mt-1';
        msgEl.textContent = '○ Pending';
      }
    }

    // Reset all layer statuses
    function resetLayerStatuses() {
      ['gitleaks', 'trivy', 'scorecard', 'codeql', 'zizmor'].forEach(layer => {
        setLayerStatus(layer, 'pending');
      });
    }

    // Add click handler for run button via JS to ensure it works
    document.addEventListener('DOMContentLoaded', () => {
      const runBtn = document.getElementById('run-check-btn');
      if (runBtn) {
        runBtn.addEventListener('click', runSecurityCheck);
      }
    });

    async function runSecurityCheck() {
      console.log('runSecurityCheck called');
      const url = document.getElementById('github-url').value.trim();
      if (!url) {
        alert('Masukkan URL GitHub dulu!');
        return;
      }

      // Extract owner/repo from URL
      const match = url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
      if (!match) {
        alert('URL GitHub tidak valid!');
        return;
      }
      const [owner, repo] = [match[1], match[2].replace('.git', '')];

      // Reset statuses
      resetLayerStatuses();

      // Show loading
      document.getElementById('security-loading').classList.remove('hidden');
      document.getElementById('security-results').classList.add('hidden');
      document.getElementById('security-actions').classList.add('hidden');

      try {
        updateLoadingStatus('Mengirim permintaan ke server...');
        
        // Set loading status for each tool
        ['gitleaks', 'trivy', 'scorecard', 'codeql', 'zizmor'].forEach(layer => {
          setLayerStatus(layer, 'loading');
        });
        
        const response = await fetch('/api/security-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, owner, repo })
        });

        const result = await response.json();
        
        if (result.error) {
          alert('Error: ' + result.error);
          return;
        }

        // Display results (will also update status indicators)
        displaySecurityResults(result);
        
        // Store repo path for import/abort
        currentRepoPath = result.repoPath;

      } catch (e) {
        alert('Error: ' + e.message);
      } finally {
        document.getElementById('security-loading').classList.add('hidden');
      }
    }

    function displaySecurityResults(results) {
      const container = document.getElementById('security-results');
      container.innerHTML = '';

      // Update layer status based on results
      const layerKeys = [
        { name: 'gitleaks', key: 'gitleaks' },
        { name: 'trivy', key: 'trivy' },
        { name: 'scorecard', key: 'scorecard' },
        { name: 'codeql', key: 'codeql' },
        { name: 'zizmor', key: 'zizmor' }
      ];
      
      layerKeys.forEach(layer => {
        const data = results.tools?.[layer.key] || results[layer.key];
        if (data?.error) {
          setLayerStatus(layer.name, 'error');
        } else if (data?.found) {
          setLayerStatus(layer.name, 'warning', 'Ditemukan');
        } else {
          setLayerStatus(layer.name, 'success');
        }
      });

      // Graphify summary
      if (results.repoPath) {
        container.innerHTML += `
          <div class="card rounded-xl p-6 border border-indigo-500/30 mb-6">
            <h3 class="text-lg font-semibold text-indigo-300 mb-3 flex items-center gap-2">
              <i data-lucide="brain" class="h-5 w-5"></i>
              Analisis Repo (Graphify)
            </h3>
            <div class="text-zinc-300 text-sm">Repo berhasil di-clone ke: ${results.repoPath}</div>
          </div>
        `;
      }

      // Security layers
      const layers = [
        { name: 'Gitleaks', key: 'gitleaks', icon: 'key', color: 'rose' },
        { name: 'Trivy', key: 'trivy', icon: 'shield-alert', color: 'amber' },
        { name: 'OpenSSF Scorecard', key: 'scorecard', icon: 'clipboard-check', color: 'emerald' },
        { name: 'CodeQL', key: 'codeql', icon: 'code', color: 'blue' },
        { name: 'zizmor', key: 'zizmor', icon: 'workflow', color: 'purple' }
      ];

      layers.forEach(layer => {
        const data = results.tools?.[layer.key] || results[layer.key];
        const status = data?.error ? 'error' : (data?.found ? 'warning' : 'success');
        const statusClass = status === 'error' ? 'text-rose-400' : (status === 'warning' ? 'text-amber-400' : 'text-emerald-400');
        const statusIcon = status === 'error' ? 'x-circle' : (status === 'warning' ? 'alert-triangle' : 'check-circle');
        
        container.innerHTML += `
          <div class="card rounded-xl p-4 border border-zinc-800">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 bg-${layer.color}-500/10 rounded-lg flex items-center justify-center">
                  <i data-lucide="${layer.icon}" class="h-5 w-5 text-${layer.color}-400"></i>
                </div>
                <span class="font-medium text-white">${layer.name}</span>
              </div>
              <div class="flex items-center gap-2 ${statusClass}">
                <i data-lucide="${statusIcon}" class="h-5 w-5"></i>
                <span class="text-sm font-medium">${data?.error ? 'Error' : (data?.found ? 'Ditemukan' : 'Bersih')}</span>
              </div>
            </div>
            ${data?.output ? `<div class="mt-3 text-sm text-zinc-400 mono whitespace-pre-wrap bg-zinc-900 p-3 rounded-lg max-h-40 overflow-auto">${data.output.substring(0, 2000)}${data.output.length > 2000 ? '...' : ''}</div>` : ''}
            ${data?.error ? `<div class="mt-3 text-sm text-rose-400 mono">${data.error}</div>` : ''}
          </div>
        `;
      });

      container.classList.remove('hidden');
      document.getElementById('security-actions').classList.remove('hidden');
      lucide.createIcons();
    }

    async function importToFolder() {
      if (!currentRepoPath) return;
      try {
        const response = await fetch('/api/security-import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath: currentRepoPath })
        });
        const result = await response.json();
        if (result.error) {
          alert('Error: ' + result.error);
        } else {
          alert('Berhasil di-import ke: ' + result.targetPath);
          currentRepoPath = null;
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    async function abortCheck() {
      if (!currentRepoPath) return;
      try {
        const response = await fetch('/api/security-abort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath: currentRepoPath })
        });
        const result = await response.json();
        if (result.error) {
          alert('Error: ' + result.error);
        } else {
          alert('Repo dipindahkan ke: ' + result.targetPath);
          currentRepoPath = null;
          // Reset UI
          document.getElementById('github-url').value = '';
          document.getElementById('security-results').classList.add('hidden');
          document.getElementById('security-actions').classList.add('hidden');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    // Enter key to run
    document.getElementById('github-url').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') runSecurityCheck();
    });
  </script>
</body>
</html>
