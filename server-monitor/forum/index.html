<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Forum</title>
    <script>
    // Blocking: fetch combos from 9Router before module loads
    try {
      var x = new XMLHttpRequest();
      x.open('GET', '/api/9router-combos', false);
      x.send();
      if (x.status === 200) {
        window.__FORUM_COMBOS__ = JSON.parse(x.responseText).combos;
      }
    } catch(e) { console.warn('combo fetch failed:', e); }
    </script>
    <script type="module" crossorigin src="./assets/index-B6O75w3Q.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DNUToBxF.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    // Context bridge: attach server-monitor context to agent prompts
    window.__FORUM_CONTEXT__ = null;
    
    // Reset old max-rounds preference once after default changed from 8 to 3
    try {
      if (localStorage.getItem('__FORUM_MAX_ROUNDS_VERSION__') !== '2') {
        localStorage.setItem('__FORUM_MAX_ROUNDS__', '3');
        localStorage.setItem('__FORUM_MAX_ROUNDS_VERSION__', '2');
      }
    } catch {}

    // Auto-restore context from localStorage on page load
    try {
      const saved = localStorage.getItem('__FORUM_CONTEXT__');
      if (saved) {
        const parsed = JSON.parse(saved);
        // Check if saved context is still fresh (< 1 hour old)
        const age = Date.now() - new Date(parsed.timestamp).getTime();
        if (age < 3600000) {
          window.__FORUM_CONTEXT__ = parsed;
          console.log('Context auto-restored from localStorage');
        } else {
          localStorage.removeItem('__FORUM_CONTEXT__');
        }
      }
    } catch (e) {
      console.warn('Failed to restore context:', e);
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const sidebar = document.querySelector('.right-panel-scroll');
        if (!sidebar) return;
        
        const section = document.createElement('section');
        section.className = 'right-section';
        section.innerHTML = `
          <div class="right-title">PROJECT CONTEXT</div>
          <div class="panel-card context-card">
            <div id="context-status" style="margin-bottom:12px;font-size:13px;color:#94a3b8;">
              Not attached
            </div>
            <button id="context-attach-btn" type="button" style="width:100%;padding:10px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;">
              Attach server-monitor context
            </button>
            <button id="context-detach-btn" type="button" style="display:none;width:100%;padding:10px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin-top:8px;">
              Detach context
            </button>
            <button id="context-check-btn" type="button" style="display:none;width:100%;padding:10px;background:#0f766e;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin-top:8px;">
              Check changes
            </button>
            <button id="context-refresh-btn" type="button" style="display:none;width:100%;padding:10px;background:#6366f1;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin-top:8px;">
              Refresh context
            </button>
          </div>
        `;
        
        const insightCard = sidebar.querySelector('.insight-card');
        if (insightCard && insightCard.parentElement) {
          insightCard.parentElement.parentElement.insertBefore(section, insightCard.parentElement);
        } else {
          sidebar.appendChild(section);
        }
        
        const statusEl = document.getElementById('context-status');
        const attachBtn = document.getElementById('context-attach-btn');
        const detachBtn = document.getElementById('context-detach-btn');
        const checkBtn = document.getElementById('context-check-btn');
        const refreshBtn = document.getElementById('context-refresh-btn');
        
        // Restore UI state if context was auto-loaded
        if (window.__FORUM_CONTEXT__) {
          const data = window.__FORUM_CONTEXT__;
          statusEl.innerHTML = `<span style="color:#10b981;">✓ Attached (restored)</span><br><small>${data.files.length} files · ${new Date(data.timestamp).toLocaleTimeString('id-ID')}</small>`;
          attachBtn.style.display = 'none';
          detachBtn.style.display = 'block';
          checkBtn.style.display = 'block';
          refreshBtn.style.display = 'block';
        }
        
        attachBtn.onclick = async () => {
          try {
            attachBtn.disabled = true;
            attachBtn.textContent = 'Loading...';
            statusEl.textContent = 'Fetching context...';
            
            const res = await fetch('/api/forum/context/server-monitor');
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || 'Failed to fetch context');
            
            window.__FORUM_CONTEXT__ = data;
            
            // Save to localStorage for auto-restore
            try {
              localStorage.setItem('__FORUM_CONTEXT__', JSON.stringify(data));
            } catch (e) {
              console.warn('Failed to save context to localStorage:', e);
            }
            
            statusEl.innerHTML = `<span style="color:#10b981;">✓ Attached</span><br><small>${data.files.length} files · ${new Date(data.timestamp).toLocaleTimeString('id-ID')}</small>`;
            attachBtn.style.display = 'none';
            detachBtn.style.display = 'block';
            checkBtn.style.display = 'block';
            refreshBtn.style.display = 'block';
          } catch (e) {
            statusEl.innerHTML = `<span style="color:#ef4444;">✗ Error: ${e.message}</span>`;
            attachBtn.disabled = false;
            attachBtn.textContent = 'Attach server-monitor context';
          }
        };
        
        detachBtn.onclick = () => {
          window.__FORUM_CONTEXT__ = null;
          
          // Remove from localStorage
          try {
            localStorage.removeItem('__FORUM_CONTEXT__');
          } catch (e) {
            console.warn('Failed to remove context from localStorage:', e);
          }
          
          statusEl.textContent = 'Not attached';
          statusEl.style.color = '#94a3b8';
          attachBtn.style.display = 'block';
          attachBtn.disabled = false;
          attachBtn.textContent = 'Attach server-monitor context';
          detachBtn.style.display = 'none';
          checkBtn.style.display = 'none';
          refreshBtn.style.display = 'none';
        };
        
        checkBtn.onclick = async () => {
          if (!window.__FORUM_CONTEXT__) return;
          try {
            checkBtn.disabled = true;
            checkBtn.textContent = 'Checking...';
            statusEl.textContent = 'Checking latest files...';
            const res = await fetch('/api/forum/context/server-monitor');
            const latest = await res.json();
            if (!res.ok) throw new Error(latest.error || 'Failed to check context');
            const changed = latest.hash !== window.__FORUM_CONTEXT__.hash;
            if (changed) {
              const oldByPath = new Map((window.__FORUM_CONTEXT__.files || []).map(f => [f.path, f.hash]));
              const changedFiles = (latest.files || [])
                .filter(f => oldByPath.get(f.path) !== f.hash)
                .map(f => f.path);
              statusEl.innerHTML = `<span style="color:#f59e0b;">Changes detected</span><br><small>${changedFiles.slice(0, 3).join(', ')}${changedFiles.length > 3 ? ` +${changedFiles.length - 3} more` : ''}</small>`;
            } else {
              statusEl.innerHTML = `<span style="color:#10b981;">No changes</span><br><small>${(window.__FORUM_CONTEXT__.files || []).length} files still up to date</small>`;
            }
            checkBtn.disabled = false;
            checkBtn.textContent = 'Check changes';
          } catch (e) {
            statusEl.innerHTML = `<span style="color:#ef4444;">✗ Error: ${e.message}</span>`;
            checkBtn.disabled = false;
            checkBtn.textContent = 'Check changes';
          }
        };
        
        refreshBtn.onclick = async () => {
          if (!window.__FORUM_CONTEXT__) return;
          try {
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';
            statusEl.textContent = 'Fetching latest context...';
            
            const res = await fetch('/api/forum/context/server-monitor');
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || 'Failed to fetch context');
            
            window.__FORUM_CONTEXT__ = data;
            
            // Update localStorage
            try {
              localStorage.setItem('__FORUM_CONTEXT__', JSON.stringify(data));
            } catch (e) {
              console.warn('Failed to save context to localStorage:', e);
            }
            
            statusEl.innerHTML = `<span style="color:#10b981;">✓ Attached</span><br><small>${data.files.length} files · ${new Date(data.timestamp).toLocaleTimeString('id-ID')} (refreshed)</small>`;
            refreshBtn.disabled = false;
            refreshBtn.textContent = 'Refresh context';
          } catch (e) {
            statusEl.innerHTML = `<span style="color:#ef4444;">✗ Error: ${e.message}</span>`;
            refreshBtn.disabled = false;
            refreshBtn.textContent = 'Refresh context';
          }
        };
        
        // Max rounds control for discussion/debate loop
        try {
          const composerActions = document.querySelector('.composer-actions');
          if (composerActions && !document.getElementById('max-rounds-select')) {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#94a3b8;';
            wrap.innerHTML = `
              <label for="max-rounds-select">Max rounds</label>
              <select id="max-rounds-select" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:8px;padding:6px 8px;">
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="8">8</option>
              </select>
              <span style="opacity:.75;">safety cap, auto-stop tetap aktif</span>
            `;
            composerActions.parentElement.appendChild(wrap);
            const select = document.getElementById('max-rounds-select');
            select.value = localStorage.getItem('__FORUM_MAX_ROUNDS__') || '3';
            localStorage.setItem('__FORUM_MAX_ROUNDS__', select.value);
            select.onchange = () => localStorage.setItem('__FORUM_MAX_ROUNDS__', select.value);
          }
        } catch (e) {
          console.warn('Failed to mount max rounds control:', e);
        }
        
        // Intercept fetch to inject context into agent prompts
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
          const [url, options] = args;
          if (url === '/api/agent-forum/turn' && options?.method === 'POST' && window.__FORUM_CONTEXT__) {
            try {
              const body = JSON.parse(options.body);
              const contextText = window.__FORUM_CONTEXT__.files.map(f => 
                `--- FILE: ${f.path} (${f.size} bytes)\n${f.excerpt}${f.truncated ? '\n[... truncated]' : ''}`
              ).join('\n\n');
              
              body.prompt = `[CONTEXT: server-monitor project files attached]\n\n${contextText}\n\n---\n\nUser prompt:\n${body.prompt}`;
              options.body = JSON.stringify(body);
            } catch (e) {
              console.warn('Failed to inject context:', e);
            }
          }
          return originalFetch(...args);
        };
      }, 1000);
    });
    </script>
  </body>
</html>
